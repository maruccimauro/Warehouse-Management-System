# Un único host para la SPA y la API (ADR-009): la cookie de sesión de Sanctum
# es de primera parte y no hace falta CORS entre orígenes.
#
#   /api, /sanctum  -> Laravel (PHP-FPM)
#   /docs/          -> wiki de usuario (VitePress), la ruta de la ayuda F1 (DM-11)
#   todo lo demás   -> servidor de desarrollo de Vite, con WebSocket para HMR

# Resolución diferida: Nginx arranca aunque frontend o wiki todavía no estén disponibles.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    client_max_body_size 20m;

    location ~ ^/(api|sanctum)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    # VitePress sirve con base /docs/: la URI se reenvía completa, sin reescribir.
    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        set $wiki http://wiki:5174;
        proxy_pass $wiki;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $vite http://frontend:5173;
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
