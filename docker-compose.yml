# Entorno de desarrollo. Uso: cp .env.example .env && docker compose up -d
name: wms

services:
  app:
    build:
      context: infrastructure/docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: wms-app:dev
    environment:
      # Las variables del entorno tienen prioridad sobre backend/.env:
      # la conexión a la base se define en un solo lugar.
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wms}
      DB_USERNAME: ${DB_USERNAME:-wms}
      DB_PASSWORD: ${DB_PASSWORD:-wms}
      # El puerto público también se define una sola vez: Sanctum trata como SPA
      # solo las peticiones de este host (ADR-009) y cambiar WEB_PORT sin esto
      # rompe el login con SESSION_REQUIRED.
      APP_URL: http://localhost:${WEB_PORT:-8080}
      SANCTUM_STATEFUL_DOMAINS: localhost:${WEB_PORT:-8080}
    # Instala dependencias, crea backend/.env y genera APP_KEY si faltan; después arranca PHP-FPM.
    entrypoint: ["sh", "/usr/local/bin/app-entrypoint.sh"]
    command: ["php-fpm"]
    volumes:
      - ./backend:/var/www/backend
      # docs/ para que las pruebas lean el catálogo de business-rules.md y
      # scramble:export escriba docs/03-architecture/openapi.json (ADR-012).
      - ./docs:/var/www/docs
      - ./infrastructure/docker/php/entrypoint.sh:/usr/local/bin/app-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.30-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - app
      - frontend
      - wiki
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    # Zona horaria del servidor en UTC para cualquier cliente, no solo la aplicación.
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wms}
      POSTGRES_USER: ${DB_USERNAME:-wms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wms}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos en /var/lib/postgresql/<versión>/docker:
      # se monta el directorio padre para que un cambio de versión mayor no pise datos.
      - db_data:/var/lib/postgresql
      # Crea la base wms_testing al inicializar un volumen vacío.
      - ./infrastructure/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: node:26-alpine
    working_dir: /app
    environment:
      # Puerto público de Nginx: el cliente de HMR de Vite abre el WebSocket contra él.
      WEB_PORT: ${WEB_PORT:-8080}
    entrypoint: ["sh", "/entrypoint.sh"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      # node_modules fuera del bind mount: binarios nativos de Linux (esbuild, rollup)
      # aislados de los del host y sin el costo de E/S del montaje en Windows y macOS.
      - frontend_node_modules:/app/node_modules
      - ./infrastructure/docker/node/entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped

  # Wiki de usuario (E2.15, DM-11): servidor de desarrollo de VitePress detrás de Nginx en /docs/.
  wiki:
    image: node:26-alpine
    working_dir: /app
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
    entrypoint: ["sh", "/entrypoint.sh"]
    command: ["npm", "run", "dev"]
    volumes:
      - ./docs/wiki:/app
      # check-help-links.ts importa ../../../frontend/src/shared/help (E2.16): el mismo
      # camino relativo que en el repositorio, resuelto desde /app/scripts.
      - ./frontend/src/shared/help:/frontend/src/shared/help:ro
      - wiki_node_modules:/app/node_modules
      - ./infrastructure/docker/node/entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
  wiki_node_modules:
